<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan a Time</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Inter", system-ui, sans-serif;
      background: linear-gradient(180deg, #ddd6fe 0%, #c084fc 30%, #a855f7 60%, #d946ef 100%);
      color: #102a43;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle 800px at 30% 30%, rgba(255,255,255,0.12) 0%, transparent 50%),
                  radial-gradient(circle 600px at 70% 80%, rgba(255,255,255,0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .card {
      width: min(100%, 500px);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
      padding: 36px;
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 3vw, 2.8rem);
    }
    p {
      margin: 0 0 28px;
      color: #475569;
      line-height: 1.7;
      font-size: 1rem;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .buttons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 140px;
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .yes {
      background: linear-gradient(135deg, #06b6d4, #0ea5e9);
      color: white;
      box-shadow: 0 16px 32px rgba(14, 165, 233, 0.22);
    }
    .no {
      background: linear-gradient(135deg, #f97316, #f59e0b);
      color: white;
      box-shadow: 0 16px 32px rgba(249, 115, 22, 0.22);
    }
    .back {
      display: block;
      margin: 30px auto 0;
      color: #334155;
      text-decoration: none;
      font-weight: 700;
    }
    .buttons a:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(15, 23, 42, 0.16);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pick a time</h1>
    <p>Choose between a 7:30p or 8:00p plan below.</p>
    <div class="buttons">
      <a href="todo.html" class="yes">7:30p</a>
      <a href="no.html" class="no">8:00p</a>
    </div>
    <a class="back" href="index.html">Back</a>
  </div>
  <script>
    const buttons = document.querySelectorAll('.buttons a');
    const container = document.querySelector('.buttons');
    buttons.forEach(btn => {
      btn.addEventListener('click', e => {
        if (btn.classList.contains('no')) {
          e.preventDefault();
          const x = Math.floor(Math.random() * 140) - 70;
          const y = Math.floor(Math.random() * 35) - 18;
          btn.style.transform = `translate(${x}px, ${y}px)`;
        }
      });
    });
  </script>
</body>
</html>
