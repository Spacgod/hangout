<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pickup Confirmed</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Inter", system-ui, sans-serif;
      background: linear-gradient(180deg, #fca5a5 0%, #f97316 25%, #ec4899 50%, #d946ef 75%, #a855f7 100%);
      color: #102a43;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle 800px at 25% 45%, rgba(255,255,255,0.11) 0%, transparent 50%),
                  radial-gradient(circle 600px at 75% 75%, rgba(255,255,255,0.09) 0%, transparent 50%);
      pointer-events: none;
    }
    .card {
      width: min(100%, 500px);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
      padding: 40px 36px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(2.2rem, 3vw, 2.8rem);
      color: #1f2937;
    }
    p {
      margin: 0 0 32px;
      color: #475569;
      line-height: 1.8;
      font-size: 1.1rem;
    }
    .time {
      font-size: 2.4rem;
      font-weight: 800;
      color: #ec4899;
      margin: 0 0 28px;
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.5) rotate(-10deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }
    .back {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ec4899, #d946ef);
      color: white;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s ease;
    }
    .back:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Perfect!</h1>
    <p>I will pick you up at</p>
    <div class="time">7:15p</div>
    <p>Looking forward to the game!</p>
    <a href="todo.html" class="back">Back</a>
  </div>
</body>
</html>
