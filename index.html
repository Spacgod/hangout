<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hangout</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Inter", system-ui, sans-serif;
      color: #102a43;
      background: linear-gradient(180deg, #fda0c3 0%, #f97fbf 25%, #ec4899 50%, #d946ef 75%, #a855f7 100%);
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle 800px at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                  radial-gradient(circle 600px at 80% 20%, rgba(255,255,255,0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .card {
      width: min(100%, 520px);
      padding: 40px 36px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.55);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: slideInUp 0.5s ease-out;
    }
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .intro {
      display: inline-flex;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.14);
      color: #3730a3;
      font-size: 0.92rem;
      margin-bottom: 18px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(2.4rem, 4vw, 3.4rem);
      line-height: 1.05;
      animation: fadeInDown 0.6s ease-out 0.2s both;
    }
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    p {
      margin: 0 0 32px;
      color: #475569;
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      min-height: 72px;
    }
    .buttons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 130px;
      padding: 16px 32px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .yes {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 18px 32px rgba(34, 197, 94, 0.22);
      z-index: 1;
    }
    .yes:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 24px 48px rgba(34, 197, 94, 0.35);
    }
    .no {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
      box-shadow: 0 18px 32px rgba(239, 68, 68, 0.22);
      z-index: 0;
    }
    .buttons a:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 36px rgba(15, 23, 42, 0.18);
    }
    .hint {
      margin-top: -14px;
      font-size: 0.95rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="intro"></div>
    <h1>Will you go on a hangout with me?</h1>
    <p></p>
    <div class="buttons">
      <a href="yes.html" class="yes">Yes</a>
      <a href="no.html" class="no" tabindex="0">No</a>
    </div>

  </div>
  <script>
    const noButton = document.querySelector('.no');
    const container = document.querySelector('.buttons');
    function moveNo() {
      const containerRect = container.getBoundingClientRect();
      const maxX = Math.max(0, containerRect.width - noButton.offsetWidth - 20);
      const x = Math.floor(Math.random() * (maxX * 0.8));
      const y = Math.floor(Math.random() * 40) - 20;
      noButton.style.transform = `translate(${x}px, ${y}px)`;
    }
    noButton.addEventListener('click', e => {
      e.preventDefault();
      moveNo();
    });
  </script>
</body>
</html>
